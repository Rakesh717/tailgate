name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: Shell syntax
        run: for f in *.sh scripts/*.sh; do sh -n "$f"; done
      - name: Build release (ad-hoc signed; notarize locally for a trusted build)
        run: ./scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Tailgate
          path: dist/*
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "Tailgate ${GITHUB_REF_NAME#v}"
